server {
    listen 80;
    server_name videos.yourapp.com;  # Replace with your domain

    # Set large buffer size for video streaming
    client_max_body_size 100M;
    client_body_buffer_size 100M;
    
    # Cache settings for videos
    proxy_cache_path /var/cache/nginx/videos levels=1:2 keys_zone=videos_cache:10m max_size=10g inactive=60m;
    proxy_temp_path /var/cache/nginx/temp;
    
    location / {
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        
        # Cache settings
        proxy_cache videos_cache;
        proxy_cache_valid 200 304 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        # Try to serve the file directly first
        try_files $uri @backend;
        
        # Set expires headers for browser caching
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    
    location @backend {
        # Forward to your Node.js backend
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Video streaming specific settings
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
